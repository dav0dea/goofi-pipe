name: Gates

on:
  push:
    branches: [ '*' ]

# One job, because the gates are one list and they share one machine's worth of setup: the SPA is
# compiled into the binary, so no cargo build here happens without the frontend's dependencies, and
# the e2e suite drives the binary that falls out of the same build.
#
# The steps are also the fresh-clone path, in order — `goofi-init`, then cargo — so a clone that
# needs a third command fails HERE rather than on a contributor's machine.
#
# One job, run on THREE machines. The list is the same list — a per-platform gate running a subset
# would be the second spelling this file exists to prevent — and it is a matrix rather than three
# jobs for that reason. The two steps it does drop are dropped because they provably cannot differ,
# not to save time; see the orientation. `fail-fast` is off so one platform's failure still reports
# the others'.
#
# It costs nothing: standard runners are free on a public repo. What each one buys is different.
# Windows is a whole separate PAL — ConPTY, a `cmd` launcher, `\` in every path, a `.pdb` two
# targets collide on. macOS is arm64, so it is the only place aarch64 is compiled at all, and the
# only place pyo3's embedded interpreter meets dylib and codesigning rules.
jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7

    # 24, not 22: 22 ships npm 10, which resolves this manifest with no lockfile into `Cannot read
    # properties of null (reading 'edgesOut')` and installs nothing; npm 11, what 24 ships, does not.
    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    # `enable-cache` OFF, not merely unkeyed. Its default glob is `uv.lock`/`requirements*.txt`,
    # and this repo has neither — so the key never changes and the cache never invalidates, which
    # GitHub warns about and is right to. What uv downloads here is two interpreters and the wheels
    # the goofi package pulls, a few seconds of a ten-minute run; the provisioning step re-decides
    # every run on purpose, and a cache nothing can invalidate is the one way that stops being true.
    #
    # v7 is the NEWEST moving major this action publishes — it stopped aliasing them after that, so
    # `@v10` is not a ref and the job fails to resolve before a step runs. It is already node24.
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false

    # No toolchain action on purpose: `rust-toolchain.toml` names the version, rustup honours it,
    # and one owner is the whole point — an action pinning `stable` here is how CI came to run a
    # compiler eight releases ahead of the one the code was checked against.
    #
    # The cache is keyed on `Cargo.lock` + the rustc version and is NOT re-saved on an exact key
    # hit, so one bad save is permanent: a run reported `full match: true` and then compiled 168
    # crates — `libc`, `serde`, the whole graph — because the entry it restored had been cleaned
    # down to less than the four cargo invocations below need. `cache-all-crates` keeps the
    # registry whole rather than pruning it to the workspace's direct dependencies, and the
    # `prefix-key` bump is what forces the one fresh save that replaces the bad entry. Moving the
    # key is the only way to re-save; it is a deliberate commit, like moving the toolchain pin.
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: v1-rust
        cache-all-crates: true

    # iceoryx2 builds its OS bindings with bindgen, which finds libclang by itself everywhere but
    # here: the runner ships LLVM and does not name it.
    - name: Name libclang (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

    # SETUP IS ONE COMMAND. It provisions both interpreters, installs the goofi wheel into each,
    # writes the cargo config that points pyo3 at the free-threaded one, and installs the
    # frontend's dependencies — every precondition the cargo steps below have. Deliberately
    # uncached: it re-decides every run, so CI can never inherit the stale-wheel gap a cached venv
    # would carry.
    - name: Provision (cargo run -p goofi-init)
      run: cargo run -p goofi-init

    # Linux only: type checking has no platform. vitest below is a different matter — it WALKS
    # the tree, and a `rel` built with `\` is how three of its guards failed on Windows alone.
    - name: Type-check (svelte-check + tsc strict)
      if: runner.os == 'Linux'
      run: npm run check
      working-directory: frontend

    - name: Unit tests (vitest)
      run: npm run test
      working-directory: frontend

    # `--all-targets` is load-bearing: a plain build never compiles the integration test targets, so
    # a warning there would ship. Clippy carries the rustc lints too, so this one command is both
    # the build-warning gate and the clippy gate — and `-D warnings` is how "…and it prints nothing"
    # becomes something a machine can hold us to.
    - name: Zero warnings (rustc + clippy)
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Tests
      run: cargo test --workspace

    # The other Python tier. Separate because it LINKS libpython — a different build of the same
    # suite rather than more of it.
    - name: Tests (in-process Python tier)
      run: cargo test -p goofi-tests --features embed

    # The e2e suite is its own npm package, and not part of building or running goofi — so it is
    # installed here rather than by goofi-init, which provisions what the two setup commands need.
    # Linux only, and the whole e2e tail with it: a browser has no platform, and the half that
    # does — the binary it drives — is what goofi-tests already proves on every runner above.
    - name: Install the e2e suite's dependencies
      if: runner.os == 'Linux'
      run: npm install
      working-directory: tests/e2e

    # Every project is chromium — the touch and tablet ones are device descriptors, not other
    # engines.
    - name: Install Playwright's browser
      if: runner.os == 'Linux'
      run: npx playwright install --with-deps chromium
      working-directory: tests/e2e

    - name: End-to-end (Playwright against the real binary)
      if: runner.os == 'Linux'
      run: npm run e2e
      working-directory: tests/e2e

    # The report and the backends' own logs — a failure here is read from both: the assertion says
    # which spec, the log says what the server did.
    - uses: actions/upload-artifact@v7
      if: failure() && runner.os == 'Linux'
      with:
        name: e2e-report-${{ matrix.os }}
        path: |
          tests/e2e/playwright-report/
          tests/e2e/test-results/
