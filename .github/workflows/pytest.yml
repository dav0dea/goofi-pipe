name: Testing

on:
  push:
    branches: [ '*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        # The Linux sounddevice wheel does not bundle PortAudio, so importing
        # the audio nodes (audiostream/audioout) raises OSError without this.
        sudo apt-get update
        sudo apt-get install -y libportaudio2

    - name: Install dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install flake8 mypy pytest pytest-forked pytest-xdist
        pip install .

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src/goofi/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 src/goofi/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type-check boundary modules (advisory)
      run: |
        # Advisory like the flake8 pass above: surfaces type issues at the
        # hand-mirrored contract boundary without blocking. mypy has no
        # flake8-style --exit-zero flag, so `|| true` swallows its exit code.
        # Promote a module to a blocking gate once it is mypy-clean.
        mypy --ignore-missing-imports \
          src/goofi/codec.py src/goofi/data.py src/goofi/message.py \
          src/goofi/node_reduce.py src/goofi/params.py src/goofi/bridge/ || true

    - name: Running pytest
      run: |
        pytest tests/ -s -v --forked -n auto
