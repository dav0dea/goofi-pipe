name: Docker

# Not on every push: this builds the whole Rust workspace in release plus both Python venvs,
# so it is minutes rather than seconds. Doc-only commits do not need it.
on:
  push:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
      - 'nodes/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docker.yml'

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build the image
      run: docker build -t goofi .

    # THE assertion this job exists for. Getting the interpreter wiring wrong is SILENT: goofi
    # still starts, still serves, and still runs every Python node — just on the slow subprocess
    # tier, with no error printed anywhere. So this asserts the COUNT. A check that merely
    # grepped for "in-process" would pass against a `0 in-process` image, which is exactly the
    # broken state it is here to catch.
    - name: Python nodes land on the in-process tier
      run: |
        out=$(docker run --rm goofi --list-nodes)
        echo "$out"
        grep -qE 'auto-routed 2 in-process \+ 0 subprocess' <<<"$out" \
          || { echo "::error::expected '2 in-process + 0 subprocess'"; exit 1; }

    # The SPA (catches a missing or unbuilt frontend/build) and, in the same run, the EMBEDDED
    # interpreter.
    #
    # The `--list-nodes` count above cannot stand in for that second one: registration goes through
    # the discovery probe, which is a subprocess and finds its own site-packages via `pyvenv.cfg`.
    # The in-process tier and the expression evaluator use the interpreter pyo3 LINKED, whose
    # sys.prefix is the base install — so an image can report "2 in-process" while every one of
    # those nodes fails to import `goofi` at runtime. That is exactly what this image did on its
    # first build. The evaluator line is the cheapest true statement that the embedded interpreter
    # can import from the venv.
    - name: The SPA is served, and the embedded interpreter can import from its venv
      run: |
        docker run -d --name smoke -p 8000:8000 goofi
        for _ in $(seq 30); do
          curl -fsS http://127.0.0.1:8000/ -o index.html && break
          sleep 1
        done
        grep -qi '<html' index.html \
          || { echo "::error::/ did not serve the SPA"; docker logs smoke; exit 1; }
        docker logs smoke 2>&1 | grep -q 'param-expression evaluator ready' \
          || { echo "::error::embedded interpreter cannot import from the venv"; docker logs smoke; exit 1; }

    # And the assertion none of the others can make: an in-process Python node EXECUTING.
    # `--list-nodes` proves routing and the evaluator line proves `import numpy`; only running a
    # node proves the tier works end to end. `Psd` is a real numpy consumer, so a healthy reply
    # here means the embedded interpreter imported goofi, ran setup(), and ran process().
    - name: An in-process Python node actually runs
      run: |
        mcp() { curl -sf -X POST http://127.0.0.1:8000/mcp -H 'Content-Type: application/json' \
                  -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"$1\",\"arguments\":$2}}"; }
        # uids come back from add_node rather than being assumed — numbering happens to start at 1
        # in a fresh container, but a test that encodes that breaks the day anything else is added
        # first, and breaks by asserting against the WRONG node rather than by failing to find one.
        add() { mcp add_node "{\"type\":\"$1\"}" | jq -r '.result.content[0].text | fromjson | .uid'; }
        osc=$(add Oscillator)
        psd=$(add Psd)
        mcp add_link "{\"node_out\":\"$osc\",\"slot_out\":\"out\",\"node_in\":\"$psd\",\"slot_in\":\"data\"}" >/dev/null
        sleep 2
        out=$(mcp inspect_node "{\"node\":\"$psd\"}")
        echo "$out"
        grep -q '"isError":true' <<<"$out" && { echo "::error::inspect_node failed"; exit 1; }
        grep -q 'error: none' <<<"$out" \
          || { echo "::error::the Python node reported an error"; docker logs smoke; exit 1; }
        grep -qE 'psd: f32\[[0-9,]+\] finite=' <<<"$out" \
          || { echo "::error::the Python node produced no output"; docker logs smoke; exit 1; }
        docker rm -f smoke

    # One `command -v` per binary. `command -v a b c` reads only the FIRST operand in dash, so
    # the single-call form reports success while two of the three are missing — caught exactly
    # that way when this image was first smoke-tested.
    - name: The agent harnesses are installed
      run: |
        docker run --rm --entrypoint sh goofi -c '
          for b in claude codex opencode; do
            command -v "$b" >/dev/null || { echo "missing: $b"; exit 1; }
          done'

    # The launch-directory contract: `-v .:/workdir` is only useful because /workdir is also the
    # working directory, which is what puts it in the Save modal as "Working dir".
    - name: The launch directory is mounted, writable, and is the working directory
      run: |
        mkdir -p launch && echo marker > launch/here.txt
        docker run --rm -v "$PWD/launch:/workdir" --entrypoint sh goofi \
          -c 'test "$(pwd)" = /workdir && cat here.txt && touch saved.gfi'
        test -f launch/saved.gfi \
          || { echo "::error::the container could not write to the mounted launch directory"; exit 1; }
