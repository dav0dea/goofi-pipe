name: Frontend

on:
  push:
    branches: [ '*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    # This repo deliberately ships NO lockfile (frontend/.gitignore: "a recipe,
    # not a frozen build"), so resolve fresh with `npm install` rather than `npm
    # ci` (which requires a lockfile).
    - name: Install dependencies
      run: npm install

    # The frontend is the only UI; these were previously ungated (CI ran only
    # Python), so the "keep 0 errors" rule had no enforcement. All three block.
    - name: Type-check (svelte-check + tsc strict)
      run: npm run check

    - name: Unit tests (vitest)
      run: npm run test

    - name: Build the SPA
      run: npm run build
