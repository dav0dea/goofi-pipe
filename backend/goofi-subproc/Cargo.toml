[package]
name = "goofi-subproc"
version.workspace = true
edition.workspace = true
license.workspace = true

# The subprocess node tier: run a Python node in an isolated GIL interpreter
# (for deps that aren't free-threading-safe, and — per the latency finding — for
# parallel heavy-Python compute, since a separate interpreter has its own object
# ownership and sidesteps free-threaded biased-refcount contention). No pyo3 here;
# this is the PARENT — it speaks goofi-codec request/response frames over iceoryx2
# shared memory (the Rust crate on BOTH ends: the child runs `goofi.serve` from the
# abi3 wheel, same 0.9.3 ABI — the Python iceoryx2 binding is gone). The child
# interpreter needs `goofi` (the wheel) + `numpy`.

[dependencies]
goofi-core = { path = "../goofi-core" }
goofi-node = { path = "../goofi-node" }
goofi-codec = { path = "../goofi-codec" }
iceoryx2 = "0.9.3"

[dev-dependencies]
indexmap = "2"
