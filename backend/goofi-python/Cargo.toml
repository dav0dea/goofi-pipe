[package]
name = "goofi-python"
version.workspace = true
edition.workspace = true
license.workspace = true

# The manager side of BOTH Python node tiers. `subproc` is unconditional — it only ever SPAWNS an
# interpreter, so a python-free binary still runs Python nodes out-of-process. `inproc` LINKS
# libpython, so it is behind `embed` and the default workspace build needs no interpreter:
#   PYO3_PYTHON=<python3.14t> cargo test -p goofi-python --features embed
[features]
default = []
embed = ["dep:pyo3", "dep:goofi_pymod"]

[dependencies]
goofi-core = { path = "../goofi-core" }
goofi-node = { path = "../goofi-node" }
goofi-signal = { path = "../signal/goofi-signal" }
# The subprocess transport: `goofi-codec` request/response frames over iceoryx2 shared memory,
# the Rust crate on BOTH ends (the child runs `goofi.serve` from the abi3 wheel, same 0.9.3 ABI).
goofi-codec = { path = "../goofi-codec" }
iceoryx2 = "0.9.3"
# The dual-built goofi pyclass crate, linked (rlib, `host`) into the embedded FT interpreter.
goofi_pymod = { path = "../goofi-pymod", package = "goofi-pymod", features = ["host"], optional = true }
pyo3 = { version = "0.29", features = ["auto-initialize"], optional = true }

[dev-dependencies]
# The shared `_Test*` node library. A dev-dependency only: it flips the feature on for test
# builds, and a release build never sees it. The link edge itself comes via goofi-engine.
goofi-nodes = { path = "../goofi-nodes", features = ["test-nodes"] }
indexmap = "2"
# For the engine-integration test (runs only under `--features embed`): proves a
# real PyNode is hosted + ticked inside a live Graph, concurrently on the pool.
goofi-engine = { path = "../goofi-engine" }

# The latency/concurrency probe needs the embedded interpreter; skip it unless
# `embed` is on (else the default workspace build would fail to compile it).
[[example]]
name = "py_latency"
required-features = ["embed"]

# Unified native-vs-FT-Python-vs-subprocess parity benchmark: all three backends in one engine,
# for a directly comparable measurement. Both Python tiers are this crate's now.
[[example]]
name = "backend_parity"
required-features = ["embed"]
