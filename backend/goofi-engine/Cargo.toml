[package]
name = "goofi-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
goofi-core = { path = "../goofi-core" }
# The GOOF frame is what a data service carries, exactly as the subprocess tier already sends it.
goofi-codec = { path = "../goofi-codec" }
goofi-node = { path = "../goofi-node" }
goofi-nodes = { path = "../goofi-nodes" }

# The async runtime's transport, at the version the Python child links — the two open the same
# services over the shared 0.9.3 ABI, and `Cargo.lock` is what actually holds them together (this
# is a caret requirement, as in the two crates that already depend on it).
iceoryx2 = "0.9.3"
# One line: the random scope a graph's service names live in.
getrandom = "0.4"
indexmap = "2"

# Control and status travel msgpack-encoded, so the thread and subprocess cases are one codec.
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
walkdir = "2"
# default-features off keeps the archive small and stamps every entry 1980-01-01 (the `time`
# feature is what would make a repack differ); `deflate-flate2-zlib-rs` is the one deflate
# spelling that selects a backend without dragging in zopfli.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

