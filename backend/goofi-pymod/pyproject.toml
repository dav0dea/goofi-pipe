[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "goofi"
# NOT stated here: `dynamic` tells maturin to take the version from Cargo.toml, which takes it
# from the workspace. A literal here would be a second place to forget — and the wheel's version
# is what `uv pip install` records, so a stale one is invisible until someone reads it.
dynamic = ["version"]
requires-python = ">=3.8"
# A node's `Data` is a numpy array on the Python side, so no interpreter can run a goofi node
# without it. Declaring it HERE rather than listing it at each install site is what lets
# provisioning be "install the goofi wheel" and nothing else — one statement of the runtime, in
# the package that defines it.
dependencies = ["numpy"]

# What the node files under `node-bundles/` import, kept out of the package's own contract: goofi
# runs perfectly well without them, and only those nodes need them. Provisioning installs
# `goofi[nodes]`, so a fresh clone can run everything it ships without carrying scipy, numba and
# mne into every embedding of the library. A bundle manifest takes this over (roadmap/library.md).
[project.optional-dependencies]
nodes = ["antropy", "mne", "pylsl", "specparam"]

[tool.maturin]
module-name = "goofi"
features = ["extension-module"]
manifest-path = "Cargo.toml"
