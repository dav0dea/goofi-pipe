[package]
name = "goofi-codec"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
goofi-core = { path = "../goofi-core" }
indexmap = { version = "2", features = ["serde"] }
rmpv = "1"
# Param transport in the subprocess request frame: serde-serialize the ParamGroups tree
# (Param derives Serialize/Deserialize) — no per-variant juggling, lossless by construction.
rmp-serde = "1"

# The parent-liveness pipe's cfg split: clearing FD_CLOEXEC in the forked child (unix) /
# marking the read HANDLE inheritable (windows). Pipe creation itself is `std::io::pipe`,
# so nothing else here is platform-specific.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
serde_json = "1"
