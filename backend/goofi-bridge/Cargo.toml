[package]
name = "goofi-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

# The build script's only dependency, and it is one string: the instruction to run goofi-init,
# which that script has to print and goofi-init owns. It links no goofi crate itself, so this
# cannot make provisioning depend on the build it provisions.
[build-dependencies]
goofi-init = { path = "../goofi-init" }

[dependencies]
goofi-core = { path = "../goofi-core" }
goofi-codec = { path = "../goofi-codec" }
goofi-node = { path = "../goofi-node" }
goofi-engine = { path = "../goofi-engine" }
goofi-view = { path = "../goofi-view" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
futures-util = "0.3"
# The mount nonce only has to be unguessable-enough to keep two concurrent goofis apart.
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The command-line split the phrase layer parses with: the same quoting bash gives argv, which is
# the contract — every transport that speaks lines gets bash's own word rules.
shell-words = "1"
# The PTY the agent harness runs on (wezterm's crate).
portable-pty = "0.9"
# What counts as an executable on THIS platform: the mode bits where those decide, `PATHEXT` where
# that does. A harness npm installed is `claude.cmd` on Windows and `claude` everywhere else, and
# the caller types the same one word for both.
which = "8"

# SIGTERM then SIGKILL, to the process GROUP: `portable_pty::ChildKiller` offers neither the
# graceful phase nor any reach past the harness into what it spawned. Windows has no equivalent and
# reaches for `taskkill` instead, so this is the one dependency that is genuinely one platform's —
# see `src/proc.rs`, the only `cfg` in this crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The shared `_Test*` node library. A dev-dependency only: it flips the feature on for test builds,
# and a release build never sees it. The link edge itself comes via goofi-engine.
goofi-nodes = { path = "../goofi-nodes", features = ["test-nodes"] }
tempfile = "3"
