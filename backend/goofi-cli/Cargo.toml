[package]
name = "goofi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "goofi-pipe"
path = "src/main.rs"

[dependencies]
goofi-bridge = { path = "../goofi-bridge" }
# Direct, for the node-registration vocabulary (`Registration`) the tier routing below reads.
goofi-engine = { path = "../goofi-engine" }
goofi-subproc = { path = "../goofi-subproc" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# In-process Python nodes + the param-expression evaluator (pyo3, free-threaded 3.14t).
# ON by default: the build script provisions a repo-local `.gfivenv-ft` and a `.cargo/config.toml`
# that point pyo3 at it, so `cargo run` needs no env vars. Build a pure-native binary (no Python,
# no interpreter needed) with `--no-default-features`.
goofi-py = { path = "../goofi-py", optional = true }

# The venv layout and the readiness check, shared with `cargo run -p goofi-init` so the build
# demands exactly what that command provides — one definition, not two that can drift.
[build-dependencies]
goofi-init = { path = "../goofi-init" }

[dependencies.goofi-init]
path = "../goofi-init"

[dev-dependencies]
# The venv-layout test writes stand-in interpreters into a throwaway tree.
tempfile = "3"

[features]
default = ["python"]
python = ["dep:goofi-py", "goofi-py/embed"]
