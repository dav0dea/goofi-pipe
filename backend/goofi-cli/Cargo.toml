[package]
name = "goofi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "goofi"
path = "src/main.rs"

[dependencies]
goofi-bridge = { path = "../goofi-bridge" }
goofi-client = { path = "../goofi-client" }
goofi-core = { path = "../goofi-core" }
# Client argv re-quoted into the ONE line /exec parses — the same word rules bash used.
shell-words = "1"
serde_json = "1"
# The scan's outcome vocabulary, which the boot report reads.
goofi-node = { path = "../goofi-node" }
# The engine's Python door, handed the interpreters at boot.
goofi-signal = { path = "../signal/goofi-signal" }
goofi-audio = { path = "../audio/goofi-audio" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# BOTH Python node tiers + the param-expression evaluator. ON by default: `cargo run -p
# goofi-init` creates a repo-local `.gfivenv-ft` and the `.cargo/config.toml` that points pyo3 at
# it, so `cargo run` needs no env vars. The build script only CHECKS that this happened — it
# cannot provision, because cargo reads that config once, at startup. Build a pure-native binary
# (no Python, no interpreter needed) with `--no-default-features`.
goofi-python = { path = "../signal/goofi-python", optional = true }
# The venv layout and the interpreter lookup, shared with `cargo run -p goofi-init` so the binary's
# default and that command's output are one definition rather than two that can drift.
goofi-init = { path = "../goofi-init" }

# The same crate again: the build script asks it which interpreter cargo resolved, so the build
# demands exactly what that command provides.
[build-dependencies]
goofi-init = { path = "../goofi-init" }

# One feature for Python node support, not one per tier: the free-threaded probe IS the router,
# so without it there is nothing to decide between in-process and subprocess.
[features]
default = ["python"]
python = ["dep:goofi-python", "goofi-python/embed", "goofi-signal/embed"]

[dev-dependencies]
# The trait the graceful-exit test's node implements.
goofi-signal-sdk = { path = "../signal/goofi-signal-sdk" }
