[package]
name = "goofi-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
# Nothing depends on this crate; it holds the suite and the harness the suite runs on. Its one
# binary is the scanner the harness hands the audio engine, a stand-in for `goofi`'s own door.
publish = false

[features]
# Forwards to goofi-python's, which LINKS libpython. Off by default, so `cargo test --workspace`
# needs no interpreter; `cargo test -p goofi-tests --features embed` runs the in-process tier too.
embed = ["goofi-python/embed", "goofi-signal/embed", "dep:pyo3"]

[dependencies]
goofi-bridge = { path = "../goofi-bridge" }
goofi-client = { path = "../goofi-client" }
goofi-core = { path = "../goofi-core" }
goofi-init = { path = "../goofi-init" }
goofi-codec = { path = "../goofi-codec" }
goofi-graph = { path = "../goofi-graph" }
goofi-signal = { path = "../signal/goofi-signal" }
goofi-signal-sdk = { path = "../signal/goofi-signal-sdk" }
goofi-audio-sdk = { path = "../audio/goofi-audio-sdk" }
goofi-audio = { path = "../audio/goofi-audio" }
goofi-node = { path = "../goofi-node" }
goofi-transport = { path = "../goofi-transport" }
goofi-view = { path = "../goofi-view" }
# The manager side of both Python tiers. `subproc` is unconditional — it only SPAWNS an
# interpreter — so its suite runs in the default build.
goofi-python = { path = "../signal/goofi-python" }
# The embed-only suites drive the interpreter directly (module hygiene, bootstrap order).
pyo3 = { version = "0.29", features = ["auto-initialize"], optional = true }
serde_json = "1"
base64 = "0.22"
# The manifest is YAML, and the session scenario reads the file the save actually wrote.
serde_yaml_ng = "0.10"
# `Events` wraps the bridge's own broadcast receiver.
tokio = { version = "1", features = ["sync", "rt", "net", "time", "io-util"] }
# The `Client` below IS a WebSocket client — the transport suite's half of the harness.
tokio-tungstenite = "0.30"
futures-util = "0.3"

# The latency probes and the parity benchmark live here, beside the OutputProbe they drive; the
# Python two need the embedded interpreter, so they skip unless `embed` is on.
[[example]]
name = "py_latency"
required-features = ["embed"]

[[example]]
name = "backend_parity"
required-features = ["embed"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tempfile = "3"
# The frame type a reducer subscription yields.
bytes = "1"
# The Meta map type the codec round-trips.
indexmap = "2"
# The golden compares msgpack meta SEMANTICALLY — the two encoders are free to order a map
# differently, and only a decoded comparison can say so.
rmpv = "1"
# Pin a tiny SO_RCVBUF on a test client so a stalled reader deterministically lags the broadcast
# ring, instead of the OS silently autotuning a huge buffer.
socket2 = "0.6"
midir = "0.11"
