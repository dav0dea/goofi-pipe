[package]
name = "goofi-py"
version.workspace = true
edition.workspace = true
license.workspace = true

# The pyo3 host is behind the `embed` feature so the default workspace build
# stays python-free. Build/test the real thing with:
#   PYO3_PYTHON=<python3.14t> PYTHONPATH=<ft site-packages> \
#     cargo test -p goofi-py --features embed
[features]
default = []
embed = ["dep:pyo3", "dep:goofi_pymod"]

[dependencies]
goofi-core = { path = "../goofi-core" }
goofi-node = { path = "../goofi-node" }
# The dual-built goofi pyclass crate, linked (rlib, `host`) into the embedded FT
# interpreter. Its `[lib] name` is `goofi`; the dep key renames it to `goofi_pymod`.
goofi_pymod = { path = "../goofi-pymod", package = "goofi-pymod", features = ["host"], optional = true }
pyo3 = { version = "0.28", features = ["auto-initialize"], optional = true }

[dev-dependencies]
indexmap = "2"
# For the engine-integration test (runs only under `--features embed`): proves a
# real PyNode is hosted + ticked inside a live Graph, concurrently on the pool.
goofi-engine = { path = "../goofi-engine" }
# The backend-parity benchmark hosts the subprocess tier alongside the in-process
# tiers in one engine, for a directly comparable measurement.
goofi-subproc = { path = "../goofi-subproc" }

# The latency/concurrency probe needs the embedded interpreter; skip it unless
# `embed` is on (else the default workspace build would fail to compile it).
[[example]]
name = "py_latency"
required-features = ["embed"]

# Unified native-vs-FT-Python-vs-subprocess parity benchmark (same env as above).
[[example]]
name = "backend_parity"
required-features = ["embed"]
