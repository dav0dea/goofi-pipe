[package]
name = "goofi-graph"
version.workspace = true
edition.workspace = true
license.workspace = true

# The op authority for the MODEL, and nothing else: it depends on goofi-node alone among the
# goofi crates, so the boundary is enforced by this manifest — the graph provably never computes
# a service name or touches an endpoint.
[dependencies]
goofi-core = { path = "../goofi-core" }
goofi-node = { path = "../goofi-node" }

# One line: the random scope a graph's service names live in.
getrandom = "0.4"
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
walkdir = "2"
# default-features off keeps the archive small and stamps every entry 1980-01-01 (the `time`
# feature is what would make a repack differ); `deflate-flate2-zlib-rs` is the one deflate
# spelling that selects a backend without dragging in zopfli.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
