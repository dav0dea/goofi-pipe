[package]
name = "goofi-signal"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The in-process Python tier, which LINKS libpython; the scan routes a file there only with it.
embed = ["goofi-python/embed"]

[dependencies]
goofi-core = { path = "../../goofi-core" }
# The scan's Python door: both tiers' probes and node types.
goofi-python = { path = "../goofi-python" }
goofi-node = { path = "../../goofi-node" }
goofi-signal-sdk = { path = "../goofi-signal-sdk", features = ["host"] }
# The scan's Rust door: build a node file, load the artifact.
goofi-build = { path = "../../goofi-build" }
goofi-transport = { path = "../../goofi-transport" }
# The GOOF frame is what a data service carries, exactly as the subprocess tier already sends it.
goofi-codec = { path = "../../goofi-codec" }

# The async runtime's transport, at the version the Python child links — the two open the same
# services over the shared 0.9.3 ABI, and `Cargo.lock` is what actually holds them together.
iceoryx2 = "0.9.3"
# Control and status travel msgpack-encoded, so the thread and subprocess cases are one codec.
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }

indexmap = "2"
serde_json = "1"
