[package]
name = "goofi-python"
version.workspace = true
edition.workspace = true
license.workspace = true

# The manager side of BOTH Python node tiers. `subproc` is unconditional — it only ever SPAWNS an
# interpreter, so a python-free binary still runs Python nodes out-of-process. `inproc` LINKS
# libpython, so it is behind `embed` and the default workspace build needs no interpreter:
#   PYO3_PYTHON=<python3.14t> cargo test -p goofi-python --features embed
[features]
default = []
embed = ["dep:pyo3", "dep:goofi_pymod"]

[dependencies]
goofi-core = { path = "../../goofi-core" }
goofi-node = { path = "../../goofi-node" }
goofi-signal-sdk = { path = "../goofi-signal-sdk" }
# The probe's introspection JSON, and the memo it is kept in.
serde_json = "1"
sha2 = "0.10"
# The venv layout, for the site-packages a probe's memo is keyed on.
goofi-init = { path = "../../goofi-init" }
# The subprocess transport: `goofi-codec` request/response frames over iceoryx2 shared memory,
# the Rust crate on BOTH ends (the child runs `goofi.serve` from the abi3 wheel, same 0.9.3 ABI).
goofi-codec = { path = "../../goofi-codec" }
iceoryx2 = "0.9.3"
# The dual-built goofi pyclass crate, linked (rlib, `host`) into the embedded FT interpreter.
goofi_pymod = { path = "../goofi-pymod", package = "goofi-pymod", features = ["host"], optional = true }
pyo3 = { version = "0.29", features = ["auto-initialize"], optional = true }

[dev-dependencies]
indexmap = "2"
