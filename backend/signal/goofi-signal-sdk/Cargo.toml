[package]
name = "goofi-signal-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The host half: loading a built node behind its vtable. Off in the node's own crate, so a cdylib
# carries none of it.
host = ["dep:libloading"]

[dependencies]
goofi-core = { path = "../../goofi-core" }
goofi-node = { path = "../../goofi-node" }
# The bytes that cross the boundary are the frames the transport already carries.
goofi-codec = { path = "../../goofi-codec" }
indexmap = "2"
libloading = { version = "0.8", optional = true }
rmp-serde = "1"
serde_json = "1"
