[package]
name = "goofi-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# ASIO is a build the USER makes, never one that ships. WASAPI publishes an interface as one stereo
# endpoint per pair the driver exposes, so a multi-input card is reachable past its first pair only
# through the driver's own ASIO view. The Steinberg SDK that binding needs went
# GPLv3-or-proprietary in 2025 and cannot travel inside this binary — `roadmap/audio-engine.md`
# carries that decision — so the flag is off, and whoever turns it on supplies the SDK themselves:
# `CPAL_ASIO_DIR` names the unpacked copy, and LLVM must be installed for its bindgen to run.
asio = ["cpal/asio"]

[dependencies]
goofi-core = { path = "../../goofi-core" }
goofi-node = { path = "../../goofi-node" }
goofi-codec = { path = "../../goofi-codec" }
goofi-transport = { path = "../../goofi-transport" }
goofi-control = { path = "../../goofi-control" }
goofi-window = { path = "../../goofi-window" }
goofi-audio-sdk = { path = "../goofi-audio-sdk", features = ["host"] }
goofi-build = { path = "../../goofi-build" }
sha2 = "0.10"
indexmap = "2"
rtrb = "0.3"
# The sound SERVER, never the card: ALSA's `default` is the hardware, so a stream on it bypasses
# the OS mixer. Pure Rust, probed at runtime, and ALSA still answers a machine with no server.
cpal = { version = "0.18", features = ["pulseaudio"] }
midir = "0.11"
vst3 = "0.3.0"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
