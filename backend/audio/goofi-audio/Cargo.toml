[package]
name = "goofi-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
goofi-core = { path = "../../goofi-core" }
goofi-node = { path = "../../goofi-node" }
goofi-codec = { path = "../../goofi-codec" }
goofi-transport = { path = "../../goofi-transport" }
goofi-audio-sdk = { path = "../goofi-audio-sdk", features = ["host"] }
goofi-build = { path = "../../goofi-build" }
sha2 = "0.10"
indexmap = "2"
rtrb = "0.3"
# The sound SERVER, never the card: ALSA's `default` is the hardware, so a stream on it bypasses
# the OS mixer. Pure Rust, probed at runtime, and ALSA still answers a machine with no server.
cpal = { version = "0.18", features = ["pulseaudio"] }
midir = "0.11"
vst3 = "0.3.0"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The window thread's platform half: a plugin's editor is a native window on the machine goofi
# runs on, and no portable crate in the offline registry covers all three.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSGeometry", "NSRunLoop", "NSString"] }
