[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[tool.black]
line-length = 128

[tool.uv]
# Supply-chain cooldown: never resolve a package version published in the last
# 7 days (rolling — recomputed on every resolve). Mirrors the frontend's npm
# `min-release-age` policy. Requires uv >= 0.9.17 for the duration form.
exclude-newer = "7 days"

[project.scripts]
goofi-pipe = "goofi.manager:main"

[project]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
]
description = "Real-time neuro-/biosignal processing and streaming pipeline."
keywords = ["signal-processing", "neurofeedback", "biofeedback", "real-time", "EEG", "ECG"]
license = {file = "LICENSE"}
name = "goofi"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<3.13"
version = "3.0.0"
dependencies = [
  "numpy<2",
  "iceoryx2>=0.9",
  "msgpack>=1.0",
  "pyyaml",
  "pyzmq",
  "aiohttp>=3.9",
  "mne-lsl",
  "antropy",
  "biotuner",
  "pyserial",
  "oscpy",
  "python-osc",
  "sounddevice",
  "openai==1.3.6",
  "httpx==0.27.2",
  "scikit-learn",
  "opencv-python==4.8.0.74",
  "webcolors>=24",
  "pylsl",
  "mediapipe",
  "librosa==0.9.2",
  "panns_inference",
  "networkx",
  "geopy",
  "edgeofpy",
  "powerlaw",
  "mido",
  "pyaca",
  "pandas",
  "fooof",
  "umap-learn",
  "mss",
  "usearch",
  "gdown",
  "neurodsp",
  "safetensors",
  "einops",
  "neurokit2",
  "pywavelets",
  "torch",
  "transformers",
  "accelerate",
  "tabulate",
  "libcst",
  "litellm",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-forked",
  "pytest-xdist",
  "flake8",
]
# Minimal install: backend + tests only, skips heavy ML/audio deps.
# Useful for CI of the core IPC layer and for iterative development on
# the transport / manager / node-runtime without pulling in torch et al.
core = [
  "numpy<2",
  "iceoryx2>=0.9",
  "msgpack>=1.0",
  "pyyaml",
]
