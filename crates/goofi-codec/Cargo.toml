[package]
name = "goofi-codec"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
goofi-core = { path = "../goofi-core" }
indexmap = { version = "2", features = ["serde"] }
rmpv = "1"
# Param transport in the subprocess request frame: serde-serialize the ParamGroups tree
# (Param derives Serialize/Deserialize) — no per-variant juggling, lossless by construction.
rmp-serde = "1"

[dev-dependencies]
serde_json = "1"
indexmap = "2"
rmpv = "1"
