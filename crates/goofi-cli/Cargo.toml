[package]
name = "goofi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "goofi-pipe"
path = "src/main.rs"

[dependencies]
goofi-bridge = { path = "../goofi-bridge" }
goofi-subproc = { path = "../goofi-subproc" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# In-process Python nodes + the param-expression evaluator (pyo3, free-threaded 3.14t).
# ON by default: the build script provisions a repo-local `.ftvenv` and a `.cargo/config.toml`
# that point pyo3 at it, so `cargo run` needs no env vars. Build a pure-native binary (no Python,
# no interpreter needed) with `--no-default-features`.
goofi-py = { path = "../goofi-py", optional = true }

[features]
default = ["python"]
python = ["dep:goofi-py", "goofi-py/embed"]
