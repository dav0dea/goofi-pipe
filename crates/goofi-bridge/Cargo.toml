[package]
name = "goofi-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
goofi-core = { path = "../goofi-core" }
goofi-codec = { path = "../goofi-codec" }
goofi-node = { path = "../goofi-node" }
goofi-engine = { path = "../goofi-engine" }
goofi-nodes = { path = "../goofi-nodes" }
goofi-view = { path = "../goofi-view" }
goofi-crdt = { path = "../goofi-crdt" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: serde_json::Map keeps INSERTION order (IndexMap, not BTreeMap). The CRDT mirror
# feeds the doc's `globals`/`nodes` Y.Maps from these maps, and the frontend reads globals in the
# doc's key order (system-first, then user creation order) — a BTreeMap would alphabetize them on a
# full/startup sync. Cargo unifies this feature across the workspace's serde_json.
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tokio-tungstenite = "0.24"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
futures-util = "0.3"
# Pin a tiny SO_RCVBUF on a test client so a stalled reader deterministically lags the
# broadcast ring (the lag-recovery test) instead of the OS silently autotuning a huge buffer.
socket2 = "0.6"
