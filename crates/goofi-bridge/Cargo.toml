[package]
name = "goofi-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
goofi-core = { path = "../goofi-core" }
goofi-codec = { path = "../goofi-codec" }
goofi-node = { path = "../goofi-node" }
goofi-engine = { path = "../goofi-engine" }
goofi-nodes = { path = "../goofi-nodes" }
goofi-view = { path = "../goofi-view" }
goofi-crdt = { path = "../goofi-crdt" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
# The mount nonce only has to be unguessable-enough to keep two concurrent goofis apart.
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The PTY the agent harness runs on (wezterm's crate).
portable-pty = "0.9"
# SIGTERM: `portable_pty::ChildKiller` only offers SIGHUP, and nothing offers SIGKILL.
libc = "0.2"

[dev-dependencies]
tokio-tungstenite = "0.24"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
futures-util = "0.3"
# Pin a tiny SO_RCVBUF on a test client so a stalled reader deterministically lags the
# broadcast ring (the lag-recovery test) instead of the OS silently autotuning a huge buffer.
socket2 = "0.6"
tempfile = "3"
