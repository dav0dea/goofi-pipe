[workspace]
resolver = "2"
members = [
    "backend/goofi-core",
    "backend/goofi-codec",
    "backend/goofi-node",
    "backend/goofi-py",
    "backend/goofi-pymod",
    "backend/goofi-nodes",
    "backend/goofi-subproc",
    "backend/goofi-engine",
    "backend/goofi-view",
    "backend/goofi-crdt",
    "backend/goofi-bridge",
    "backend/goofi-cli",
]

[workspace.package]
# THE version of goofi — the single source of truth. Every crate takes it via
# `version.workspace = true`, `mcp.rs` reports it through `env!("CARGO_PKG_VERSION")`, and the
# Python wheel derives it too (`goofi-pymod/pyproject.toml` declares the version `dynamic`, which
# is what makes maturin read it from here instead of restating it).
version = "3.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[profile.release]
lto = "thin"
codegen-units = 1
